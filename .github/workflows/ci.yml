name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time. On main the next run waits for this one, so
# two quick pushes never take the same version; on a PR a new push cancels
# the run it makes stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn lint
      # Unused files, exports and dependencies (see knip.json).
      - run: yarn knip

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info

  # Known vulnerabilities in what ships to browsers. Dev tools are left to
  # Dependabot's pull requests, so a dev-only advisory doesn't block a deploy.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn npm audit --environment production --severity high --recursive

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn format:check

  # The version this run ships as: the next release on main, `X.Y.Z-pr.N` on a
  # PR (see scripts/release-version.ts). Needs the full history and the tags.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node scripts/release-version.ts ${PR_NUMBER:+--pr "$PR_NUMBER"} --notes release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  build:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      # The bundle that ships: deploy takes this artifact instead of building
      # again. The Firebase web config isn't secret (it ends up in the bundle)
      # but lives in secrets to stay out of the repo; PRs from forks get none,
      # and they don't deploy.
      - name: Build
        run: yarn build
        env:
          VITE_APP_VERSION: ${{ needs.version.outputs.version }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Security rules against the Realtime Database emulator (needs Java).
  test-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: yarn install --immutable
      - run: yarn test:rules

  # The app in Chromium (desktop and phone) against the Auth and Database
  # emulators: the main flows end to end, including sharing between people.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: yarn install --immutable
      - name: Cache Playwright's Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: npx playwright install --with-deps chromium
      - run: yarn test:e2e
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Only ships once every check above has passed. Pushes to main go to the live
  # channel; PRs get an ephemeral preview channel. PRs from forks are skipped,
  # since they don't receive the Firebase secrets.
  deploy:
    # Hosting waits for the rules on main: a new client against old rules (or
    # the reverse) would fail its reads and writes until both are live.
    needs: [lint, typecheck, test, test-rules, e2e, audit, format, version, build, deploy-rules]
    if: >-
      always() && !cancelled()
      && needs.version.result == 'success'
      && needs.lint.result == 'success' && needs.typecheck.result == 'success'
      && needs.test.result == 'success' && needs.test-rules.result == 'success'
      && needs.e2e.result == 'success'
      && needs.audit.result == 'success'
      && needs.format.result == 'success' && needs.build.result == 'success'
      && (needs.deploy-rules.result == 'success' || needs.deploy-rules.result == 'skipped')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      # write: to tag the release after a live deploy.
      contents: write
      checks: write
      pull-requests: write
    steps:
      # firebase.json (headers, rewrites) comes from the checkout; the files
      # from the build job.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      # Only main goes live, from a push or a manual run.
      - name: Deploy to Firebase Hosting (live)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live

      # Every live deploy is a GitHub Release, tagged on the deployed commit.
      # Only after the deploy succeeds: a failed one leaves no tag, and the
      # next run takes the same version.
      - uses: actions/download-artifact@v7
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: release-notes
          path: ${{ runner.temp }}
      - name: Release on GitHub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Deploy to Firebase Hosting (preview)
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}

  # Rules used to ship only with a manual `firebase deploy --only database`,
  # so the live rules could fall behind the code (side topics with `goalName`
  # and the `cancelled` status were rejected on production). Deploy them with
  # every push (or manual run) on main. Hosting deploys after it, so client
  # and rules move together.
  #
  # Both deploys use FIREBASE_SERVICE_ACCOUNT, a key of the dedicated
  # `github-deploy` service account, which holds only what deploying needs:
  # Firebase Hosting Admin, Firebase Realtime Database Admin, Service Usage
  # Consumer and API Keys Viewer. Never use the firebase-adminsdk account here:
  # it can read and delete every user's data.
  deploy-rules:
    needs: [lint, typecheck, test, test-rules, e2e, audit, format, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      # The firebase-tools version locked in yarn.lock, the one the emulator
      # tests ran with, not whatever 15.x npm serves today.
      - run: yarn install --immutable
      - name: Deploy Realtime Database rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          creds="$RUNNER_TEMP/firebase-sa.json"
          trap 'rm -f "$creds"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$creds"
          export GOOGLE_APPLICATION_CREDENTIALS="$creds"
          yarn firebase deploy --only database --project "$FIREBASE_PROJECT_ID" --non-interactive
