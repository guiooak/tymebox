# The style guide moved to https://guiooak.github.io/tymebox-style-guide/
# (repo guiooak/tymebox-style-guide, which publishes docs/brand from here).
# This keeps the old address, https://guiooak.github.io/tymebox/, working by
# redirecting it there.
name: Brand manual redirect

on:
  push:
    branches: [main]
    paths: ['.github/workflows/brand-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: brand-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Build the redirect
        run: |
          mkdir -p site
          for page in index.html tymebox-brand-manual.html; do
            cat > "site/$page" <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <title>Tymebox style guide</title>
              <link rel="canonical" href="https://guiooak.github.io/tymebox-style-guide/" />
              <meta http-equiv="refresh" content="0; url=https://guiooak.github.io/tymebox-style-guide/" />
            </head>
            <body>
              <p>The Tymebox style guide moved to
                <a href="https://guiooak.github.io/tymebox-style-guide/">guiooak.github.io/tymebox-style-guide</a>.</p>
            </body>
          </html>
          HTML
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
