# Publishes the logo manual and style guide (docs/brand) to GitHub Pages:
# https://guiooak.github.io/tymebox/
name: Brand manual

on:
  push:
    branches: [main]
    paths: ['docs/brand/**', '.github/workflows/brand-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: brand-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the site
        run: |
          mkdir -p site
          cp -R docs/brand/. site/
          cp docs/brand/tymebox-brand-manual.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
